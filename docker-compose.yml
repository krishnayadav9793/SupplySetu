name: supplysetu

services:
  postgres:
    image: postgres:16-alpine
    container_name: supplysetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: supplysetu
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d supplysetu']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: supplysetu-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/supplysetu?schema=public
      CLIENT_URL: http://localhost
      JWT_SECRET: supplysetu_production_docker_secret_key_123456789
    ports:
      - '5000:5000'

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: supplysetu-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '80:80'
      - '5173:80'

volumes:
  postgres_data:
    driver: local
